name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy strict typing
        run: mypy src
      - run: pytest
      - run: python scripts/validate_starter.py
      - run: python scripts/validate_regression_corpus.py
      - name: Generate walking-skeleton review artifacts
        if: matrix.python-version == '3.11'
        run: |
          sc-referee demo examples/walking-skeleton --output .demo-audit
          sc-referee replay .demo-audit/semantic.lock.json --output .demo-replay
      - name: Upload walking-skeleton review artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: walking-skeleton-audit
          path: |
            .demo-audit/report.html
            .demo-audit/audit.bundle.json
            .demo-audit/semantic.lock.json
            .demo-replay/audit.bundle.json
            VALIDATION.txt
