[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-referee-evaluation"
version = "0.1.0.dev0"
description = "Isolated answer-side validation tools for sc-referee qualification evidence"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "sc-referee==0.4.0",
]

[project.optional-dependencies]
stopped-selected-result-v1-1 = ["cryptography>=41,<46"]

[project.scripts]
sc-referee-eval = "sc_referee_evaluation.cli:entrypoint"
sc-referee-eval-selected-result = "sc_referee_evaluation.selected_result_qualification_runner:entrypoint"
sc-referee-eval-selected-result-target-worker = "sc_referee_evaluation.selected_result_qualification_target_worker:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sc_referee_evaluation.qualification_resources.selected_result_v1_1" = ["*.json", "*.txt"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sc_referee_evaluation"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../src"
