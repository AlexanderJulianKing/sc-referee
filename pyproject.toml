[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = [".", "src", "evaluation/src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".demo-audit",
  ".demo-replay",
  ".venv",
  "build",
  "docs",
  # Frozen qualification evidence, including intentionally invalid retained
  # case producers that must never be repaired or reformatted.
  "evaluation/qualification",
  "examples/walking-skeleton",
  "reference",
  "src/sc_referee/resources",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/sc_referee/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["sc_referee"]
exclude = '^src/sc_referee/resources/'

# These released analyzers predate mypy 2.x's stricter reuse/narrowing rules. Keep
# their runtime bytes stable while retaining strict checking everywhere else.
[[tool.mypy.overrides]]
module = "sc_referee.scientific_checks.quantity_dataflow_adapter"
disable_error_code = ["assignment", "attr-defined", "index"]

[[tool.mypy.overrides]]
module = "sc_referee.scientific_checks.founder_orientation_dataflow"
disable_error_code = ["assignment", "arg-type", "unused-ignore"]

[[tool.mypy.overrides]]
module = "sc_referee.scientific_checks.copy_dosage_dataflow"
disable_error_code = ["assignment"]

[tool.coverage.run]
source = ["sc_referee"]
branch = true
