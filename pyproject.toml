[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-referee"
version = "0.3.0"
description = "Conservative evidence compiler for scientific-analysis auditing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alexander King" }]
maintainers = [{ name = "Alexander King" }]
dependencies = [
  "h5py>=3.11",
  "jinja2>=3.1",
  "jsonschema>=4.22",
  "numpy>=1.26,<2.5",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "referencing>=0.35",
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-r @ https://github.com/r-lib/tree-sitter-r/archive/346d3707b8c9301f1051e8f6e32666e67529f7d2.tar.gz#sha256=52d7a2d3cc5ef8a1db82da1cbc3a500bbf63518dbc578b92b30a5bc962f6bb29",
  "typer>=0.12",
]

[project.optional-dependencies]
single-cell-recompute = [
  "pydeseq2>=0.5,<0.6",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-jsonschema>=4.22",
  "types-PyYAML>=6.0",
]

[project.scripts]
sc-referee = "sc_referee.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sc_referee = [
  "reporting/templates/*.j2",
  "resources/capability-manifests-v1/*.json",
